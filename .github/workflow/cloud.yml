name: cloud
 
on: push
 
jobs:
  backend-lint:
    name: Lint Recipe Backend Code
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4
 
      - name: Run Super Linter on backend
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
